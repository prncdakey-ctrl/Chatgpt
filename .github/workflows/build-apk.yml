# Copy this file into YOUR repo as .github/workflows/build-apk.yml
# Your app goes in app/ (AndroidManifest.xml, java/..., app.env). Every change to app/ builds a native APK.
# Get it from: Actions > latest run > Artifacts > apk   (or Releases > latest > app.apk)
name: Build APK
on:
  push:
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Get free offline toolchain
        run: |
          curl -fsSL -o /tmp/toolchain.zip https://github.com/Veektall/android-apk-kit/releases/download/toolchain/toolchain.zip
          mkdir -p /tmp/kit && unzip -q /tmp/toolchain.zip -d /tmp/kit
      - name: Build native APK
        run: |
          bash /tmp/kit/build.sh "$GITHUB_WORKSPACE/app"
          mkdir -p out && cp /tmp/kit/out/*.apk out/
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk, retention-days: 7 }
      - name: Publish download link
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.apk --title "Latest APK" --notes "Native build of app/ at ${GITHUB_SHA::7}"
